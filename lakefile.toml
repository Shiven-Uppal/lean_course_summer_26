name = "lean_course_summer_26"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCourseSummer26"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "verso-slides"
git = "https://github.com/leanprover/verso-slides.git"
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "LeanCourseSummer26"

[[lean_lib]]
name = "Exercises"

[[lean_lib]]
name = "LectureNotes"
srcDir = "."
roots = [
  "LectureNotes.lecture5.examples5",
  "LectureNotes.lecture6.examples6",
  "LectureNotes.lecture7.examples7",
  "LectureNotes.lecture8.examples8",
  "LectureNotes.lecture9.examples9",
  "LectureNotes.lecture9.examples9.2",
  "LectureNotes.lecture10.examples10",
]

[[lean_lib]]
name = "Lecture1Slides"
srcDir = "LectureNotes"
roots = ["lecture1.lecture1"]

[[lean_exe]]
name = "lecture1-slides"
srcDir = "LectureNotes"
root = "lecture1.main"

[[lean_lib]]
name = "Lecture2Slides"
srcDir = "LectureNotes"
roots = ["lecture2.lecture2"]

[[lean_exe]]
name = "lecture2-slides"
srcDir = "LectureNotes"
root = "lecture2.main"
